<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 2420 1370" width="2420" height="1370" font-family="'DejaVu Sans', Verdana, Arial, sans-serif"><defs>
