  <text x="2370" y="1310" style="font-size:15px;fill:#3b2f72;text-anchor:end">Purple: proposed DFI additions</text>
  <text x="53" y="1348" style="font-size:13px;fill:#6b7280">Sources: checked-out core_tile 2528e7d · Sargantana 403975c · HPDCache c523164 · Feng et al., RVDFI §4</text>
  <text x="2370" y="1348" style="font-size:13px;fill:#6b7280;text-anchor:end">↔ request / response   Dashed: control / translation</text>
