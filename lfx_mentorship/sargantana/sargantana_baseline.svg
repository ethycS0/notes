<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 1210" width="2100" height="1210" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#565d6b"/>
    </marker>
    <style>
      .bg { fill:#ffffff; }
      .gbox { fill:#e3f1ea; stroke:#2f7d62; stroke-width:1.6; }
      .xbox { fill:#cbd0d8; stroke:#5f6672; stroke-width:1.6; }
      .cont { fill:none; stroke:#2f7d62; stroke-width:1.6; }
      .contg { fill:none; stroke:#9aa0aa; stroke-width:1.4; }
      .ln { fill:none; stroke:#565d6b; stroke-width:1.6; }
      .dash { fill:none; stroke:#565d6b; stroke-width:1.6; stroke-dasharray:6 4; }
      .t { fill:#0f4a35; font-weight:bold; font-size:17px; text-anchor:middle; }
      .s { fill:#0f4a35; font-size:14px; text-anchor:middle; }
      .tg { fill:#2d3748; font-weight:bold; font-size:20px; text-anchor:middle; }
      .sg { fill:#2d3748; font-size:16px; text-anchor:middle; }
      .lbl { fill:#6b7280; font-size:13px; }
      .lblr { fill:#6b7280; font-size:13px; text-anchor:end; }
      .grp { fill:#0f4a35; font-weight:bold; font-size:16px; }
      .big { fill:#0f4a35; font-weight:bold; font-size:22px; }
    </style>
  </defs>

  <rect class="bg" width="2100" height="1210"/>

  <!-- Title -->
  <text x="53" y="65" style="font-size:34px;font-weight:bold;fill:#0f4a35">Sargantana Baseline</text>
  <text x="53" y="98" style="font-size:18px;fill:#6b7280">Seven-stage core · in-order issue · out-of-order completion · dual-wide graduation</text>

  <!-- Containers -->
  <rect class="cont" x="30" y="125" width="1660" height="985"/>
  <text class="big" x="50" y="162">Sargantana core_tile</text>
  <rect class="cont" x="60" y="171" width="1190" height="619"/>
  <text class="big" x="80" y="203">Sargantana core</text>
  <text x="310" y="202" style="font-size:16px;fill:#6b7280">RV64 · seven stages · in-order issue</text>
  <text class="grp" x="110" y="253">Instruction pipeline</text>

  <rect class="contg" x="1730" y="125" width="340" height="985"/>
  <text x="1752" y="166" style="font-size:20px;font-weight:bold;fill:#2d3748">Lower Memory Hierarchy</text>

  <!-- Pipeline blocks -->
  <rect class="gbox" x="110" y="280" width="100" height="72"/>
  <text class="t" x="160" y="312">Fetch 1</text><text class="s" x="160" y="331">PC / predict</text>
  <rect class="gbox" x="234" y="280" width="100" height="72"/>
  <text class="t" x="284" y="312">Fetch 2</text><text class="s" x="284" y="331">Instructions</text>
  <rect class="gbox" x="358" y="280" width="100" height="72"/>
  <text class="t" x="408" y="312">Decode</text><text class="s" x="408" y="331">Opcode</text>
  <rect class="gbox" x="482" y="280" width="100" height="72"/>
  <text class="t" x="532" y="312">Rename</text><text class="s" x="532" y="331">Register map</text>
  <rect class="gbox" x="606" y="280" width="110" height="72"/>
  <text class="t" x="661" y="303">Read</text><text class="t" x="661" y="323">Registers</text><text class="s" x="661" y="341">Operands</text>
  <rect class="gbox" x="740" y="280" width="110" height="72"/>
  <text class="t" x="795" y="312">Execute</text><text class="s" x="795" y="331">FUs / dispatch</text>
  <rect class="gbox" x="874" y="280" width="110" height="72"/>
  <text class="t" x="929" y="312">Writeback</text><text class="s" x="929" y="331">Completion</text>

  <!-- Graduation List / Retirement Control -->
  <rect class="gbox" x="660" y="440" width="240" height="85"/>
  <text class="t" x="780" y="468" style="font-size:18px">Graduation List</text>
  <text class="s" x="780" y="488" style="font-size:15px">32 slots · circular</text>
  <text class="s" x="780" y="507" style="font-size:15px">head / head+1 candidates</text>
  <rect class="gbox" x="980" y="440" width="210" height="85"/>
  <text class="t" x="1085" y="468" style="font-size:18px">Retirement Control</text>
  <text class="s" x="1085" y="488" style="font-size:15px">0–2 in-order commits</text>
  <text class="s" x="1085" y="507" style="font-size:15px">Retire mask / CSR / traps</text>

  <!-- MMU -->
  <rect class="gbox" x="110" y="585" width="260" height="190"/>
  <text class="grp" x="125" y="611">MMU / translation</text>
  <rect class="gbox" x="128" y="628" width="90" height="48"/>
  <text class="t" x="173" y="658">ITLB</text>
  <rect class="gbox" x="252" y="628" width="90" height="48"/>
  <text class="t" x="297" y="658">DTLB</text>
  <rect class="gbox" x="170" y="722" width="172" height="40"/>
  <text class="t" x="256" y="747">Shared PTW</text>

  <!-- Memory execution -->
  <rect class="gbox" x="490" y="585" width="540" height="190"/>
  <text class="grp" x="505" y="611">Memory execution · mem_unit</text>
  <rect class="gbox" x="510" y="625" width="140" height="60"/>
  <text class="t" x="580" y="650">Address gen.</text><text class="s" x="580" y="669">Effective VA</text>
  <rect class="gbox" x="680" y="625" width="130" height="60"/>
  <text class="t" x="745" y="650">LSQ</text><text class="s" x="745" y="669">Translate / issue</text>
  <rect class="gbox" x="850" y="625" width="150" height="60"/>
  <text class="t" x="925" y="650">Store buffer</text><text class="s" x="925" y="669">Wait for commit</text>
  <rect class="gbox" x="680" y="722" width="320" height="30"/>
  <text class="t" x="840" y="742" style="font-size:15px">S0-S2 / tagged memory completion</text>

  <!-- Shared hardware (gray) -->
  <rect class="xbox" x="110" y="880" width="230" height="65"/>
  <text class="tg" x="225" y="908">L1 I-cache</text><text class="sg" x="225" y="928">Separate miss / refill</text>

  <rect class="xbox" x="880" y="850" width="680" height="185"/>
  <text x="1220" y="926" style="font-size:24px;font-weight:bold;fill:#2d3748;text-anchor:middle">Shared L1 D-cache / HPDCache</text>
  <text class="sg" x="1220" y="952">32 KiB · 128 sets × 4 ways · 64-byte lines · write-through</text>
  <text class="s" x="1220" y="978" style="fill:#2d3748;font-size:15px">Native arbitration / SID routing · nonblocking misses / MSHRs · write buffer</text>

  <!-- Sargantana adapters (green) -->
  <rect class="gbox" x="550" y="850" width="240" height="65"/>
  <text class="t" x="670" y="878">CPU D-cache adapter</text><text class="s" x="670" y="897">dcache_interface · SID 1</text>
  <rect class="gbox" x="550" y="975" width="240" height="60"/>
  <text class="t" x="670" y="1002">PTW HPDCache adapter</text><text class="s" x="670" y="1021">Native requester · SID 0</text>

  <!-- Lower memory hierarchy -->
  <rect class="xbox" x="1750" y="270" width="300" height="100"/>
  <text class="tg" x="1900" y="315">Lower-memory interfaces</text>
  <text class="sg" x="1900" y="340" style="font-size:15px">I-cache refill · D-cache read / write</text>
  <text x="1742" y="434" style="font-size:15px;font-weight:bold;fill:#2d3748">Configuration-dependent backing</text>
  <text x="1742" y="461" style="font-size:14px;fill:#6b7280">RTL simulation: l2_behav + DPI</text>
  <text x="1742" y="489" style="font-size:14px;fill:#6b7280">FPGA: AXI4 adaptation</text>

  <rect class="contg" x="1750" y="600" width="300" height="360"/>
  <text x="1768" y="635" style="font-size:20px;font-weight:bold;fill:#2d3748">L2 / Main Memory</text>
  <rect class="xbox" x="1770" y="660" width="260" height="52"/>
  <text class="tg" x="1900" y="692">Program code / data</text>

  <!-- ================= Connections ================= -->
  <!-- Pipeline flow -->
  <path class="ln" d="M210,316 H234" marker-end="url(#arr)"/>
  <path class="ln" d="M334,316 H358" marker-end="url(#arr)"/>
  <path class="ln" d="M458,316 H482" marker-end="url(#arr)"/>
  <path class="ln" d="M582,316 H606" marker-end="url(#arr)"/>
  <path class="ln" d="M716,316 H740" marker-end="url(#arr)"/>
  <path class="ln" d="M850,316 H874" marker-end="url(#arr)"/>

  <!-- Fetch 2 <-> L1 I-cache -->
  <path class="ln" d="M284,352 V540 H80 V912 H110" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="lbl" x="100" y="531">Fetch / instructions</text>

  <!-- Read Registers -> Graduation List -->
  <path class="ln" d="M636,352 V482 H660" marker-end="url(#arr)"/>
  <text class="lblr" x="626" y="455">Allocate /</text>
  <text class="lblr" x="626" y="471">assign GL index</text>

  <!-- Execute -> Address gen (hop over Allocate line) -->
  <path class="ln" d="M770,352 V395 H642 a6,6 0 0 0 -12,0 H460 V665 H510" marker-end="url(#arr)"/>
  <text class="lbl" x="476" y="414">Address + operation</text>
  <text class="lbl" x="476" y="430">+ GL index</text>

  <!-- Writeback -> Graduation List -->
  <path class="ln" d="M900,352 V415 H840 V440" marker-end="url(#arr)"/>

  <!-- S0-S2 completion -> Writeback (routed around the right of Retirement Control) -->
  <path class="ln" d="M1000,737 H1220 V390 H955 V352" marker-end="url(#arr)"/>
  <text class="lblr" x="1210" y="381">Out-of-order WB · GL index</text>

  <!-- GL <-> Retirement -->
  <path class="ln" d="M900,470 H980" marker-end="url(#arr)"/>
  <path class="dash" d="M980,500 H900" marker-end="url(#arr)"/>

  <!-- Retirement <-> Store buffer (dashed) -->
  <path class="dash" d="M1140,525 V560 H920 V625" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="lbl" x="935" y="552">Commit / stall + GL index</text>

  <!-- Memory execution internals -->
  <path class="ln" d="M650,645 H680" marker-end="url(#arr)"/>
  <path class="ln" d="M810,655 H850" marker-end="url(#arr)"/>
  <path class="ln" d="M745,685 V722" marker-end="url(#arr)"/>
  <path class="ln" d="M925,685 V722" marker-end="url(#arr)"/>

  <!-- DTLB <-> LSQ (dashed) -->
  <path class="dash" d="M342,652 H430 V703 H665 V672 H680" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="lbl" x="500" y="720">DTLB req / PPN</text>

  <!-- MMU internal -->
  <path class="ln" d="M195,676 V722" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <path class="ln" d="M297,676 V722" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- ITLB <-> L1 I-cache (dashed) -->
  <path class="dash" d="M145,676 V880" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Shared PTW <-> PTW adapter -->
  <path class="ln" d="M342,742 H400 V1005 H550" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="lbl" x="408" y="990">Physical PTE access</text>

  <!-- S0-S2 <-> CPU D-cache adapter -->
  <path class="ln" d="M950,752 V825 H670 V850" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="lbl" x="680" y="818">Program loads / committed stores</text>

  <!-- Adapters <-> HPDCache -->
  <path class="ln" d="M790,882 H880" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <path class="ln" d="M790,1005 H880" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- HPDCache <-> Lower-memory interfaces -->
  <path class="ln" d="M1560,942 H1625 V295 H1750" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="lblr" x="1615" y="700">Shared read / write</text>
  <text class="lblr" x="1615" y="717">and refill traffic</text>

  <!-- L1 I-cache <-> Lower-memory interfaces (independent path) -->
  <path class="ln" d="M225,945 V1075 H1660 V345 H1750" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="lbl" x="700" y="1066">I-cache miss / refill · independent path</text>

  <!-- Lower-memory interfaces <-> L2 -->
  <path class="ln" d="M2030,370 V600" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Legend / footer -->
  <text x="2050" y="1150" style="font-size:15px;fill:#6b7280;text-anchor:end">Green: Sargantana · Gray: shared hardware</text>
  <text x="53" y="1190" style="font-size:13px;fill:#6b7280">Sources: checked-out core_tile 2528e7d · Sargantana 403975c · HPDCache c523164 · Feng et al., RVDFI §4</text>
  <text x="2050" y="1190" style="font-size:13px;fill:#6b7280;text-anchor:end">↔ request / response   Dashed: control / translation</text>
</svg>
